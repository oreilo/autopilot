[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "oreilo-autopilot"
version = "1.1.0"
description = "Permission-gated autonomous browser agent with Playwright and OpenAI-compatible models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OREiLO"}]
dependencies = ["playwright>=1.45,<2", "httpx>=0.27,<1", "pydantic>=2,<3", "typer>=0.12,<1", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "beautifulsoup4>=4.12,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.6"]
[project.scripts]
autopilot = "oreilo_autopilot.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
